<div class="flex justify-center mt-20">
  <h1 class="font-bold text-gray-500 text-6xl mb-6">Contact us</h1>
</div>

<div class="bg-green-300 mt-5 flex p-10 justify-center items-center mx-40 shadow-lg rounded-md">
    <form class="w-full max-w-lg">
      <div class="flex space-x-7">

        <div class="w-full md:w-1/2">
          <label for="" class="block uppercase font-medium mb-2 tracking-wider">First Name</label>
          <input type="text" placeholder="Jane" class="block mb-3 border w-full border-green-500 rounded-md p-3 text-lg">
          <p class="text-s italic text-green-500">Please fill out this field</p>
        </div>

        <div class="w-full md:w-1/2">
          <label for="" class="block uppercase font-medium mb-2 tracking-wider">Last Name</label>
          <input type="text" placeholder="Doe" class="block border w-full border-green-500 rounded-md p-3 text-lg">
        </div>

      </div>

        <div class="flex mt-4">
          <div class="w-full">
            <label class="block uppercase font-medium mb-2 tracking-wider">Email</label>
            <input type="text" placeholder="example@example.com" class="mb-3 block border w-full border-green-500 rounded-md p-3 text-lg">
            <p class="text-s italic text-gray-700">Please fill out this field</p>
          </div>
        </div>

         <div class="flex mt-4">
          <div class="w-full">
            <label class="block uppercase font-medium mb-2 tracking-wider">Message</label>
              <textarea class="mb-3 h-48 resize-none block border w-full border-green-500 rounded-md p-3 text-lg">
              </textarea>
            <p class="text-s italic text-gray-700">Please fill out this field</p>
          </div>
        </div>

        <div class="md:flex md:items-center mt-10">
          <div class="md:w-1/3">
            <button class="bg-green-400 shadow hover:bg-green-500 transition-colors text-white py-2 px-7 tracking-wider text-2xl rounded-lg font-bold">Send</button>
          </div>
        </div>

    </form>
</div>
